[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mcp-safecheck"
version = "0.1.0"
description = "A tiny CLI that audits MCP server configs for risky commands, secrets, and prompt-injection bait."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mcp-safecheck contributors" }]
keywords = ["mcp", "ai-agents", "security", "cli", "secret-scanning", "prompt-injection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
mcp-safecheck = "mcp_safecheck.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/mcp-safecheck"
Issues = "https://github.com/your-name/mcp-safecheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_safecheck"]
